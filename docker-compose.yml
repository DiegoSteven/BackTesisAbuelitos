version: '3'
services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: fazt
      POSTGRES_PASSWORD: fastpassword
      POSTGRES_DB: abuelitosBack
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  backend:
    build: .
    restart: always
    ports:
      - 5000:5000
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=fazt
      - DB_PASSWORD=fastpassword
      - DB_NAME=abuelitosBack
    depends_on:
      - db
  
  dashboard:
    build: ./Dashboard
    restart: always
    ports:
      - 3000:80
    depends_on:
      - backend
  
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - 5050:80
    depends_on:
      - db

volumes:
  postgres_data:
